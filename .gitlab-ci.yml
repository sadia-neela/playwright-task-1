stages:
  - test

test:
  stage: test
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  script:
    - npm ci
    - npx playwright test
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    reports:
      junit: test-results/junit.xml
    expire_in: 7 days
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
